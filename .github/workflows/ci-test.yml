name: CI - Vitest Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout app repo
      uses: actions/checkout@v4
      with:
        path: totem-app

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: totem-app/package-lock.json

    - name: Cache node modules
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('totem-app/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install app dependencies
      working-directory: ./totem-app
      run: npm ci

    - name: Check types
      working-directory: ./totem-app
      run: npm run check-types

    - name: Run ESLint
      working-directory: ./totem-app
      run: npm run lint

    - name: Build
      working-directory: ./totem-app
      env:
        CI: false
      run: npm run build

    - name: Run tests with coverage
      working-directory: ./totem-app
      run: npm run test:ci
