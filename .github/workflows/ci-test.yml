name: CI - Jest Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout app repo
      uses: actions/checkout@v4
      with:
        path: totem-app

    - name: Checkout contracts repo
      uses: actions/checkout@v4
      with:
        repository: totembound/totem-contracts
        path: totem-contracts

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Cache node modules
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install contracts dependencies
      working-directory: ./totem-contracts
      run: npm install

    - name: Export Contract ABIs
      working-directory: ./totem-contracts
      run: npx hardhat export-abi

    - name: Install app dependencies
      working-directory: ./totem-app
      run: npm ci

    - name: Check types
      working-directory: ./totem-app
      run: npm run check-types || exit 0

    - name: Run ESLint
      working-directory: ./totem-app
      # Adding || true to prevent lint warnings from failing the build
      run: npm run lint || true

    - name: Build
      working-directory: ./totem-app
      env:
        CI: false # Prevents build from treating warnings as errors
      run: npm run build

    - name: Run tests with coverage
      working-directory: ./totem-app
      run: npm run test:ci || exit 0

